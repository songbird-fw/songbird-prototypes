# Predefined palette shipped with Songbird: 16 colours (team decision 2026-10-19; the original
# 7 keep their hex). Same names and hex as PREDEFINED_PALETTE in songbird-fw/schema/validate.py.
# The hex is fixed (R-055.1, DM-33); the comment says what a colour means in a given network.
apiVersion: "config.songbird-fw.com/v1alpha1"
